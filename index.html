<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dino Tycoon" />
    <meta name="theme-color" content="#1b3a4b" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Dino Tycoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" class="hud">
      <div class="hud-group">
        <span class="hud-title">🦕 Dino Tycoon</span>
        <span id="hud-money" class="hud-stat">$0</span>
        <span id="hud-clock" class="hud-stat">Day 1 · 08:00</span>
        <span id="hud-dinos" class="hud-stat">0 dinos</span>
        <button id="btn-people" class="hud-btn" aria-label="People">👥<span>People</span><b id="hud-guests" class="hud-count">0</b></button>
        <button id="btn-park" class="hud-btn" aria-label="Park report">📊<span>Park</span></button>
        <button id="btn-guide" class="hud-btn" aria-label="Dino Guide">📖<span>Guide</span></button>
        <button id="btn-goals" class="hud-btn" aria-label="Goals">🏆<span>Goals</span></button>
        <button id="btn-log" class="hud-btn" aria-label="Park log">🔔<span>Log</span><b id="log-badge" class="badge hidden"></b></button>
      </div>
      <div class="hud-group" role="group" aria-label="Game speed">
        <button class="speed-btn" data-speed="0" aria-label="Pause">❚❚</button>
        <button class="speed-btn" data-speed="1" aria-label="Normal speed">▶</button>
        <button class="speed-btn" data-speed="3" aria-label="Fast">▶▶</button>
        <button class="speed-btn" data-speed="8" aria-label="Very fast">▶▶▶</button>
        <button id="btn-menu" class="speed-btn" aria-label="Menu">☰</button>
      </div>
    </div>

    <div id="info" class="info hidden" aria-live="polite">
      <span id="info-text"></span>
      <button id="info-action" class="action-btn hidden"></button>
    </div>

    <div class="toolbar">
      <div id="fence-picker" class="hud-group picker hidden" role="group" aria-label="Fence type"></div>
      <div id="feeder-picker" class="hud-group picker hidden" role="group" aria-label="Feeder type"></div>
      <div id="building-picker" class="hud-group picker hidden" role="group" aria-label="Building type"></div>
      <div id="path-picker" class="hud-group picker hidden" role="group" aria-label="Path tool"></div>
      <div id="decor-picker" class="hud-group picker hidden" role="group" aria-label="Garden items"></div>
      <div class="hud-group tools" role="group" aria-label="Tools">
        <button id="btn-catalog" class="tool-btn">🦖<span>Dinos</span></button>
        <button class="tool-btn" data-mode="feeder">🍖<span>Feeder</span></button>
        <button class="tool-btn" data-mode="building">🏪<span>Build</span></button>
        <button class="tool-btn" data-mode="path">🛤️<span>Path</span></button>
        <button class="tool-btn" data-mode="decor">🌳<span>Garden</span></button>
        <button class="tool-btn" data-mode="fence">🚧<span>Fence</span></button>
        <button class="tool-btn" data-mode="demolish">🧨<span>Remove</span></button>
        <button class="tool-btn" data-mode="land">🗺️<span>Land</span></button>
      </div>
    </div>

    <div id="toasts" class="toasts" role="status">
      <div id="update-banner" class="update-banner hidden" role="status">
        <span>A new version of Dino Tycoon is ready</span>
        <button id="update-apply" class="action-btn">Update</button>
      </div>
    </div>

    <aside id="tutorial" class="tutorial hidden" aria-live="polite">
      <div class="tutorial-head"><b>Guide</b><span class="tutorial-count"></span></div>
      <p class="tutorial-text"></p>
      <div class="tutorial-actions">
        <button class="action-btn tutorial-next" hidden></button>
        <button class="tutorial-skip tutorial-skip-step">Skip this step</button>
        <button class="tutorial-skip tutorial-skip-all">Skip tutorial</button>
      </div>
    </aside>


    <div id="catalog" class="modal hidden" role="dialog" aria-label="Buy dinosaurs">
      <div class="modal-card">
        <header class="modal-head">
          <h2>Buy Dinosaurs</h2>
          <button class="modal-close" aria-label="Close">✕</button>
        </header>
        <div class="species-grid"></div>
      </div>
    </div>

    <div id="people" class="modal hidden" role="dialog" aria-label="People">
      <div class="modal-card people-card">
        <header class="modal-head"><nav class="tabs" role="tablist"></nav><button class="modal-close" aria-label="Close">✕</button></header>
        <div class="log-filters" role="group" aria-label="Filter"></div>
        <div class="panel-body people-body"></div>
      </div>
    </div>

    <div id="log" class="modal hidden" role="dialog" aria-label="Park log">
      <div class="modal-card">
        <header class="modal-head">
          <h2>🔔 Park log</h2>
          <button class="modal-close" aria-label="Close">✕</button>
        </header>
        <div class="log-filters" role="group" aria-label="Filter"></div>
        <ol class="log-list panel-body"></ol>
      </div>
    </div>

    <div id="guide" class="modal hidden" role="dialog" aria-label="Dino Guide">
      <div class="modal-card">
        <header class="modal-head">
          <h2>📖 Dino Guide</h2>
          <button class="modal-close" aria-label="Close">✕</button>
        </header>
        <div class="guide-body">
          <nav class="guide-list" role="tablist" aria-label="Species"></nav>
          <article class="guide-detail" aria-live="polite"></article>
        </div>
      </div>
    </div>

    <div id="park" class="modal hidden" role="dialog" aria-label="Park report">
      <div class="modal-card">
        <header class="modal-head">
          <div class="tabs" role="tablist">
            <button class="tab-btn" data-tab="goals" role="tab">Goals</button>
            <button class="tab-btn" data-tab="overview" role="tab">Overview</button>
            <button class="tab-btn" data-tab="staff" role="tab">Staff</button>
            <button class="tab-btn" data-tab="finances" role="tab">Finances</button>
            <button class="tab-btn" data-tab="bank" role="tab">Bank</button>
          </div>
          <button class="modal-close" aria-label="Close">✕</button>
        </header>
        <div id="park-body" class="panel-body"></div>
      </div>
    </div>

    <div id="menu" class="menu hidden">
      <div class="menu-sky"></div>
      <div class="menu-content">
        <h1 class="menu-title">DINO <br>TYCOON</h1>
        <div class="menu-body"></div>
      </div>
      <div class="menu-parade" aria-hidden="true"></div>
    </div>

    <div id="pause" class="modal hidden" role="dialog" aria-label="Menu">
      <div class="modal-card pause-card">
        <h2>Paused</h2>
        <button class="menu-btn primary" data-pause="resume">Resume</button>
        <button class="menu-btn" data-pause="save">Save now</button>
        <button class="menu-btn" data-pause="settings">Settings</button>
        <div class="settings" hidden></div>
        <button class="menu-btn" data-pause="menu">Save &amp; main menu</button>
      </div>
    </div>

    <div id="outcome" class="modal hidden" role="dialog" aria-label="Scenario result">
      <div class="modal-card outcome-card"><div class="outcome-body"></div></div>
    </div>

    <div id="rotate-hint" class="rotate-hint">
      <div>📱↻</div>
      <p>Turn your device sideways to play</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
